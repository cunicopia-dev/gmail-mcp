[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-account-gmail-mcp"
version = "0.6.0"
description = "Multi-account Gmail MCP server for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Keith Cunic" },
]
keywords = ["gmail", "email", "mcp", "ai", "google", "multi-account"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=2.1,<3",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/cunicopia-dev/gmail-mcp"
Repository = "https://github.com/cunicopia-dev/gmail-mcp"
Issues = "https://github.com/cunicopia-dev/gmail-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"
gmail-mcp-auth = "gmail_mcp.auth:main"
# Alias matching the PyPI distribution name so `uvx multi-account-gmail-mcp` runs
# the server with no --from needed.
multi-account-gmail-mcp = "gmail_mcp.server:main"

# PyPI distribution is `multi-account-gmail-mcp` (multi-account is the whole point;
# the bare `gmail-mcp` name is taken by an unrelated project). The import package
# stays `gmail_mcp` and the CLI command stays `gmail-mcp`.
[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
